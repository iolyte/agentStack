name: CI

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

jobs:
  mission-control:
    name: Mission Control Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mission-control
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  control-plane:
    name: Control Plane Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  orchestrator:
    name: Orchestrator Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/orchestrator/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile gateway config -q
