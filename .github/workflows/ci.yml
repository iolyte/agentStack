name: CI

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

jobs:
  mission-control:
    name: Mission Control Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mission-control/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  desktop:
    name: Desktop Validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run desktop:prepare-sidecars
      - run: npm run build
      - run: npm run desktop:check
      - run: npm run desktop:build

  docker:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config -q
