name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish, for example v1.1.0'
        required: true
      name:
        description: 'Optional release title'
        required: false
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Before Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mission-control/package-lock.json
      - name: Install mission-control dependencies
        working-directory: mission-control
        run: npm ci
      - name: Lint
        working-directory: mission-control
        run: npm run lint
      - name: Typecheck
        working-directory: mission-control
        run: npm run typecheck
      - name: Build
        working-directory: mission-control
        run: npm run build
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config -q

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TITLE="${{ github.event.inputs.name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
            case "${GITHUB_REF_NAME}" in
              *-*) PRERELEASE="true" ;;
              *) PRERELEASE="false" ;;
            esac
          fi

          if [ -z "$TITLE" ]; then
            TITLE="clawstack ${TAG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

