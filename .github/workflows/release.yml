name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish, for example v0.1.0-beta.1'
        required: true
      name:
        description: 'Optional release title'
        required: false
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TITLE="${{ github.event.inputs.name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
            case "${GITHUB_REF_NAME}" in
              *-*) PRERELEASE="true" ;;
              *) PRERELEASE="false" ;;
            esac
          fi

          VERSION="${TAG#v}"

          if [ -z "$TITLE" ]; then
            TITLE="clawstack ${TAG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Before Release
    runs-on: ubuntu-latest
    needs: meta
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mission-control/package-lock.json
      - name: Install mission-control dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Validate compose
        working-directory: ${{ github.workspace }}
        run: |
          cp .env.example .env
          docker compose config -q

  publish-mission-control-image:
    name: Publish Mission Control Image
    runs-on: ubuntu-latest
    needs: [meta, validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push mission-control image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clawstack-mission-control
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          TAG_ARGS=(-t "$IMAGE_NAME:$VERSION")

          if [ "$PRERELEASE" = "true" ]; then
            TAG_ARGS+=(-t "$IMAGE_NAME:beta")
          else
            TAG_ARGS+=(-t "$IMAGE_NAME:stable")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file mission-control/Dockerfile \
            "${TAG_ARGS[@]}" \
            --push \
            mission-control

  build-desktop-beta:
    name: Build macOS Beta Bundle
    runs-on: macos-latest
    needs: [meta, validate, publish-mission-control-image]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_KEYCHAIN_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required release secret: $key" >&2
              exit 1
            fi
          done
      - name: Install desktop dependencies
        run: npm ci
      - name: Fetch bundled cloudflared sidecars
        run: npm run desktop:prepare-sidecars
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/clawstack-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/clawstack-signing.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build notarized DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build:dmg
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clawstack-macos-beta
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build-desktop-beta]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clawstack-macos-beta
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            artifacts/**/*.dmg
