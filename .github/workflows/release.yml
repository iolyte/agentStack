name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish, for example v0.1.0-beta.1'
        required: true
      name:
        description: 'Optional release title'
        required: false
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TITLE="${{ github.event.inputs.name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
            case "${GITHUB_REF_NAME}" in
              *-*) PRERELEASE="true" ;;
              *) PRERELEASE="false" ;;
            esac
          fi

          VERSION="${TAG#v}"

          if [ -z "$TITLE" ]; then
            TITLE="agentStack ${TAG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Before Release
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json
      - name: Install mission-control dependencies
        working-directory: apps/mission-control
        run: npm ci
      - name: Lint mission-control
        working-directory: apps/mission-control
        run: npm run lint
      - name: Typecheck mission-control
        working-directory: apps/mission-control
        run: npm run typecheck
      - name: Test mission-control
        working-directory: apps/mission-control
        run: npm run test
      - name: Build mission-control
        working-directory: apps/mission-control
        run: npm run build
      - name: Install control-plane dependencies
        working-directory: apps/control-plane
        run: npm install
      - name: Build control-plane
        working-directory: apps/control-plane
        run: npm run build
      - name: Install orchestrator dependencies
        working-directory: apps/orchestrator
        run: npm install
      - name: Build orchestrator
        working-directory: apps/orchestrator
        run: npm run build
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config -q

  publish-mission-control-image:
    name: Publish Mission Control Image
    runs-on: ubuntu-latest
    needs: [meta, validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push mission-control image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clawstack-mission-control
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          TAG_ARGS=(-t "$IMAGE_NAME:$VERSION")
          if [ "$PRERELEASE" = "true" ]; then TAG_ARGS+=(-t "$IMAGE_NAME:beta"); else TAG_ARGS+=(-t "$IMAGE_NAME:stable"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --file apps/mission-control/Dockerfile "${TAG_ARGS[@]}" --push apps/mission-control

  publish-control-plane-image:
    name: Publish Control Plane Image
    runs-on: ubuntu-latest
    needs: [meta, validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control-plane image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clawstack-control-plane
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          TAG_ARGS=(-t "$IMAGE_NAME:$VERSION")
          if [ "$PRERELEASE" = "true" ]; then TAG_ARGS+=(-t "$IMAGE_NAME:beta"); else TAG_ARGS+=(-t "$IMAGE_NAME:stable"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --file apps/control-plane/Dockerfile "${TAG_ARGS[@]}" --push apps/control-plane

  publish-orchestrator-image:
    name: Publish Orchestrator Image
    runs-on: ubuntu-latest
    needs: [meta, validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orchestrator image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clawstack-orchestrator
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          TAG_ARGS=(-t "$IMAGE_NAME:$VERSION")
          if [ "$PRERELEASE" = "true" ]; then TAG_ARGS+=(-t "$IMAGE_NAME:beta"); else TAG_ARGS+=(-t "$IMAGE_NAME:stable"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --file apps/orchestrator/Dockerfile "${TAG_ARGS[@]}" --push apps/orchestrator

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, publish-mission-control-image, publish-control-plane-image, publish-orchestrator-image]
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
