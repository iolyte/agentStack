version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/mission-control"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/orchestrator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
