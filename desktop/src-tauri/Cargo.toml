[package]
name = "clawstack-desktop"
version = "0.1.0-beta.1"
description = "macOS launcher and runtime shell for clawstack"
authors = ["iolyte"]
edition = "2021"

[lib]
name = "clawstack_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"

[profile.dev.package.scrypt]
opt-level = 3
