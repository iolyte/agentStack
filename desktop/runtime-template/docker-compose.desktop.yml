networks:
  agentstack_net:
    driver: bridge

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: agentstack-openclaw
    restart: unless-stopped
    networks: [agentstack_net]
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./data/openclaw/config:/home/node/.openclaw
      - ./data/openclaw/workspace:/home/node/.openclaw/workspace
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_GATEWAY_AUTH_MODE: password
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      CLAWDBOT_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      OPENCLAW_GATEWAY_BIND: lan
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mission-control:
    image: ${AGENTSTACK_MISSION_CONTROL_IMAGE}
    container_name: agentstack-mission-control
    restart: unless-stopped
    networks: [agentstack_net]
    ports:
      - "${MC_PORT:-4000}:4000"
    volumes:
      - ./data:/stack-data:ro
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 4000
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      MC_ADMIN_PASSWORD: ${MC_ADMIN_PASSWORD:-}
      MC_PASSWORD: ${MC_ADMIN_PASSWORD:-}
      MC_SESSION_SECRET: ${MC_SESSION_SECRET:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MC_SECURE_COOKIES: ${MC_SECURE_COOKIES:-false}
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NGINX_URL: http://nginx
      STACK_DATA_ROOT: /stack-data
      MISSION_CONTROL_BUILD: agentstack-desktop-beta
    depends_on:
      openclaw:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: agentstack-postgres
    restart: unless-stopped
    networks: [agentstack_net]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentstack}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentstack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentstack-redis
    restart: unless-stopped
    networks: [agentstack_net]
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentstack-qdrant
    restart: unless-stopped
    networks: [agentstack_net]
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: agentstack-nginx
    restart: unless-stopped
    networks: [agentstack_net]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openclaw
      - mission-control
