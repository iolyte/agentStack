networks:
  clawnet:
    driver: bridge

services:

  # ─── OpenClaw Gateway ───────────────────────────────────────────
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    networks: [clawnet]
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./.data/openclaw/config:/home/node/.openclaw
      - ./.data/openclaw/workspace:/home/node/.openclaw/workspace
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_GATEWAY_AUTH_MODE: password
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      CLAWDBOT_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      OPENCLAW_GATEWAY_BIND: lan
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Mission Control Dashboard ──────────────────────────────────
  mission-control:
    build:
      context: ./mission-control
      dockerfile: Dockerfile
    container_name: mission-control
    restart: unless-stopped
    networks: [clawnet]
    ports:
      - "${MC_PORT:-4000}:4000"
    volumes:
      - ./.data:/stack-data:ro
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 4000
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      MC_ADMIN_PASSWORD: ${MC_ADMIN_PASSWORD:-}
      MC_PASSWORD: ${MC_PASSWORD:-}
      MC_SESSION_SECRET: ${MC_SESSION_SECRET:-}
      MC_SECURE_COOKIES: ${MC_SECURE_COOKIES:-false}
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NGINX_URL: http://nginx
      STACK_DATA_ROOT: /stack-data
      MISSION_CONTROL_BUILD: phase3-admin
    depends_on:
      openclaw:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [clawnet]
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clawstack}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clawstack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks: [clawnet]
    volumes:
      - ./.data/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Qdrant Vector DB ────────────────────────────────────────────
  qdrant:
    build:
      context: ./qdrant
      dockerfile: Dockerfile
    container_name: qdrant
    restart: unless-stopped
    networks: [clawnet]
    volumes:
      - ./.data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks: [clawnet]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openclaw
      - mission-control
